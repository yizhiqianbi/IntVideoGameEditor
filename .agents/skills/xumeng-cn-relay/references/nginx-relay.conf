# 叙梦国内加速中继：香港节点 → Cloudflare 源站
#
# 用法：
#   1) 替换 server_name / 证书路径（或保持默认配合 acme-issue.sh）
#   2) 放到 /etc/nginx/conf.d/cn-edge.conf
#   3) nginx -t && systemctl reload nginx
#
# 原则：源站永远是 xumengchat.top。本机只做缓存与透传，不落任何用户数据。
# 注意：Cloudflare 里 cn 记录必须是「灰云 / DNS only」，否则流量又回到 CF 代理。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 回源必须强制 IPv4：多数香港轻量服务器没有 IPv6 路由，而 Cloudflare 的 AAAA
# 会先被解析到，nginx 连 IPv6 失败后表现为 421/403/502（实测踩过）。
# 因此不用 upstream 块，改用变量 proxy_pass + resolver ipv6=off。
resolver 1.1.1.1 223.5.5.5 valid=300s ipv6=off;

proxy_cache_path /var/cache/nginx/cn-edge levels=1:2 keys_zone=cn_edge:64m
                 max_size=2g inactive=14d use_temp_path=off;

server {
    listen      80;
    listen      [::]:80;
    server_name cn.xumengchat.top;

    # 证书续期用的 HTTP-01 验证目录（acme.sh --webroot）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                 # nginx >= 1.25.1；旧版改成 listen 443 ssl http2;
    server_name cn.xumengchat.top;

    # 变量 proxy_pass 需要 resolver；set 必须在 server/location 里
    set $origin https://xumengchat.top;

    ssl_certificate     /etc/nginx/ssl/cn.xumengchat.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cn.xumengchat.top/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 200m;

    # ---- 与源站保持一致的 Host / SNI ----
    proxy_http_version 1.1;
    proxy_set_header Host              xumengchat.top;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # 源站多处校验 Origin === 自身 origin；浏览器发来的是 cn 子域，必须改写，否则写接口 403。
    proxy_set_header Origin            https://xumengchat.top;

    proxy_ssl_server_name on;
    proxy_ssl_name        xumengchat.top;
    proxy_ssl_protocols   TLSv1.2 TLSv1.3;

    # 源站绝对跳转留在中继上，避免用户被弹回主域
    proxy_redirect        https://xumengchat.top/ /;

    proxy_connect_timeout 10s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # ---- 静态资源：哈希文件名，边缘长缓存（首屏大头）----
    location ^~ /assets/ {
        proxy_pass $origin$request_uri;

        # 只接受 gzip，缓存里就不会混入 br，避免不支持的客户端拿到乱码
        proxy_set_header Accept-Encoding "gzip";

        proxy_cache            cn_edge;
        proxy_cache_key        $scheme$host$request_uri;
        proxy_cache_valid      200 30d;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock       on;
        proxy_ignore_headers   Set-Cookie Cache-Control Expires;
        proxy_hide_header      Cache-Control;
        proxy_hide_header      Set-Cookie;

        add_header Cache-Control  "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag   "noindex, nofollow" always;
    }

    # ---- API：SSE / WebSocket 流式透传，不缓冲不缓存 ----
    location ^~ /api/ {
        proxy_pass $origin$request_uri;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      600s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---- SPA / HTML / 媒体：透传，不做共享缓存（避免个性化内容进缓存）----
    location / {
        proxy_pass $origin$request_uri;
        proxy_cache off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
