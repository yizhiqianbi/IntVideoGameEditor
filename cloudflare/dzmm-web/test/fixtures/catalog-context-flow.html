<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'self'; frame-src 'none'; worker-src 'none'" />
    <title>叙梦目录设定 · 本地隔离验收</title>
    <style>
      * { box-sizing: border-box; } body { margin: 0; }
      .fixture-panel { padding: 12px 18px; color: #eee; background: #222733; font: 13px/1.45 system-ui, sans-serif; border-bottom: 1px solid #667488; }
      .fixture-panel h1 { font-size: 18px; margin: 0 0 6px; }.fixture-panel p { margin: 5px 0; }
      .fixture-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      .fixture-actions button { padding: 6px 10px; color: #fff; background: #35455a; border: 1px solid #7d8d9e; border-radius: 5px; font: inherit; cursor: pointer; }
      .fixture-panel pre { max-height: 190px; overflow: auto; margin: 6px 0 0; white-space: pre-wrap; font-size: 11px; }
      .fixture-panel details summary { cursor: pointer; }
    </style>
  </head>
  <body><div id="fixture-controls"></div><div id="root"></div><script type="module" src="./catalog-context-flow.tsx"></script></body>
</html>
