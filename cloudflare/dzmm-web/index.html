          <li><a href="/c/xumeng-foreverse-peiyu">裴聿 - AI角色聊天</a>：一个把「真相」当信仰的酷吏，和一双他从死牢里捞出来的眼睛。</li>
          <li><a href="/c/xumeng-foreverse-tangtuantuan">唐团团 - AI角色聊天</a>：你楼下面包店的老板娘，一个把「欢迎回来」说得比全世界都用力的元气甜妹。她的日历上画满了星星——你最近才发现，有一颗星星的日期，是你第一次来店里的那天。</li>
          <li><a href="/c/xumeng-foreverse-wangushi">晚孤市 - AI角色聊天</a>：身份: 一座只在凌晨 0:00–5:00 营业的梦境夜市，开在「生者的梦」与「醒不来的记忆」交界处。入口随机出现在现实城市的某个旧巷口，只有收到居民证彩信的人看得见。</li>
          <li><a href="/c/xumeng-foreverse-shenyan">沈砚 - AI角色聊天</a>：你的匿名买家现身了。包下你首展最贵那幅画的人，是八年前在雨夜里说「你配不上沈家门槛」的那个人。他现在管你叫「您」。</li>
          <li><a href="/c/xumeng-foreverse-huoyushen">霍聿深 - AI角色聊天</a>：你们签了 22 条协议结婚。今晚他拿着退烧药和体温计站在你门口，手里还有一份刚写好的《补充条款（一）》。</li>

          <li><a href="/c/xumeng-foreverse-songzhixia">宋知夏 - AI角色聊天</a>：你是新来的队医助理，任务是盯着她别碰跑道。你到场的第一天，她正打算穿鞋开跑，看见你，头也不抬：「回去写实习报告，就写我很配合。」</li>
