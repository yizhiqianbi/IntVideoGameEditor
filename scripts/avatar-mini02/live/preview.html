<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字人素材循环预览</title>
<style>body{margin:0;background:#160f12;color:#f6eeee;font:15px system-ui;text-align:center}.stage{position:relative;max-width:440px;aspect-ratio:1;margin:12px auto;overflow:hidden;border-radius:14px}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#reply{opacity:0;transition:opacity .12s}#reply.visible{opacity:1}button{padding:10px 16px;margin:4px;border-radius:10px;border:1px solid #654651;background:#e9afb8;color:#27131a;cursor:pointer}small{color:#bea6ae}</style>
<div class="stage"><video id="idle" src="/behaviors/listening.mp4?v=2" autoplay loop muted playsinline></video><video id="reply" playsinline preload="auto"></video></div>
<p id="state">待机循环 · 无声</p><button id="play">播放有声回复样例</button><button id="stop">返回待机</button><button id="resume" hidden>允许声音并继续播放</button><p><small>加载期间继续待机；实际出声后切换；结束后回到循环待机。</small></p>
<script src="/av-player.js?v=3"></script><script>
const state=document.getElementById('state');
const player=new AvatarPlayer({idle:document.getElementById('idle'),reply:document.getElementById('reply'),resume:document.getElementById('resume'),onSpeaking:()=>state.textContent='正在说话 · 声音已播放',onWaiting:s=>state.textContent=s,onEnded:()=>state.textContent='待机循环 · 无声',onError:s=>state.textContent=s});
document.getElementById('play').onclick=()=>player.play('/sample.mp4');
document.getElementById('stop').onclick=()=>{player.stop();state.textContent='待机循环 · 无声';};
window.addEventListener('pagehide',()=>player.destroy());
</script></html>
